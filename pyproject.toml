[project]
name = "ratemypic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "anrg-init", email = "electronicdm565@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.20.0,<4.0.0",
